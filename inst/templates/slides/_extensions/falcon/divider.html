<script>
// A red .section-header divider turns the footer and slide number white. The
// chrome sits outside the slides, so the current slide's classes are mirrored
// onto the reveal.js container and falcon-rules.scss keys off them.
(function () {
  function sync(slide) {
    var reveal = document.querySelector('.reveal');
    if (!reveal || !slide) return;
    reveal.classList.toggle('falcon-divider-dark',
      slide.classList.contains('level1') && slide.classList.contains('section-header'));
  }
  function hook() {
    if (!window.Reveal || typeof Reveal.on !== 'function') {
      setTimeout(hook, 50);
      return;
    }
    Reveal.on('ready', function (e) { sync(e.currentSlide); });
    Reveal.on('slidechanged', function (e) { sync(e.currentSlide); });
    if (typeof Reveal.isReady === 'function' && Reveal.isReady()) {
      sync(Reveal.getCurrentSlide());
    }
  }
  hook();
})();
</script>
