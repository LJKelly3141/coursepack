title: Falcon
author: Logan Kelly
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [dark, falcon-fonts.scss, falcon-palette.scss, falcon-rules.scss]
      highlight-style: a11y-dark
      include-after-body: divider.html
      slide-number: true
      transition: slide
      navigation-mode: linear
      controls: true
      width: 1280
      height: 720
      embed-resources: true
