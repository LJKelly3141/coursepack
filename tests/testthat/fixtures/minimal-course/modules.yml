    title: Sample R/exams Quiz
    qti: build/qti/quiz-sample.zip
    published: true
    group: Quizzes
  - id: q-bank
    title: Module 1 Bank Quiz
    group: Quizzes
    published: true
    due: 2026-09-25
    bank:
      dir: questions
      chapters: [1, 2]
      draws: [2, 1, 2]
      points: 5
      unlock_at: "2026-09-18 08:00:00"
  - id: carried-quiz
    title: Carried Quiz
    published: true
    due: 2026-10-02
    source_ref: g00000000000000000000000000000q01
