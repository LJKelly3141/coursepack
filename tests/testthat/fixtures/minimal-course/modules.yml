# Item forms: header, page (iframe and body), link (chapter and url),
# assignment (homework, quiz_file, todo), quiz (R/exams zip).
modules:
  - title: "Module 1: Start Here"
    published: true
    sequential: true
    items:
      - header: "1. Read the welcome page"
      - page: welcome
        indent: 1
      - page: chapter-one
        indent: 1
      - link: "Reading: the first chapter"
        chapter: ch01
        anchor: sec-intro
        indent: 1
      - link: "Textbook home"
        chapter: ""
      - link: "An outside page"
        url: "{site}/extra.html"
        new_tab: true
      - assignment: hw-1
      - assignment: quiz-1
      - assignment: todo-1
      - quiz: q-sample
      - page: video-one
      - quiz: q-bank
      - assignment: memo-1
  - title: "Module 2: Unpublished"
    published: false
    items:
      - header: "Coming later"
      - link: "Chapter Two"
        chapter: ch02
  - title: "Module 3: Carried"
    published: true
    items:
      - page: carried-page
      - assignment: carried-asg
      - quiz: carried-quiz
pages:
  - slug: welcome
    title: Welcome
    iframe: "{site}/welcome.html"
    width: "100%"
    height: "800"
  - slug: chapter-one
    title: Chapter One
    body: true
  - slug: video-one
    title: A Video
    iframe: "https://www.youtube-nocookie.com/embed/xyz"
    width: "560"
    height: "315"
    video: true
  - slug: carried-page
    title: Carried Page
    source_ref: g00000000000000000000000000000c01
assignments:
  - id: hw-1
    title: Homework 1
    points: 50
    due: 2026-09-15
    published: true
    homework:
      chapter: ch01
      anchor: homework-assignment
      title: Chapter One Homework
  - id: quiz-1
    title: Module 1 Quiz
    points: 20
    due: 2026-09-20
    published: true
    quiz_file: assessments/quizzes/quiz01.md
    group: Quizzes
  - id: todo-1
    title: Placeholder Assignment
    published: false
    todo: "write this once the chapter exists"
    homework:
      chapter: ch02
  - id: memo-1
    title: Position Memo Draft
    points: 2
    grading_type: pass_fail
    submission_types: online_upload
    group: Assignments
    published: true
    due: "2026-09-17 09:30"
    description: "<p>Upload your draft before class on Thursday.</p>"
  - id: carried-asg
    title: Carried Assignment
    published: true
    due: 2026-10-01
    source_ref: g00000000000000000000000000000a01
quizzes:
